<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="HeartCode: build a personal website for someone special">
  <title>HeartCode</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183fad"/>
      <stop offset="1" stop-color="#0f2a78"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1BF0A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F1BF0A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F1BF0A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1280" height="340" rx="28"/></clipPath>
    <style>
      .title { font: 800 92px 'Poppins','Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #ffffff; letter-spacing: -2px; }
      .tag   { font: 500 28px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #dbe4ff; }
      .chip  { font: 700 17px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #14151d; }
      .beat  { transform-origin: 1090px 170px; animation: beat 2.4s ease-in-out infinite; }
      .orb1  { animation: float 7s ease-in-out infinite; }
      .orb2  { animation: float 9s ease-in-out infinite reverse; }
      .line  { animation: slide 4.5s linear infinite; }
      @keyframes beat  { 0%,100% { transform: scale(1); } 14% { transform: scale(1.09); } 28% { transform: scale(1); } 42% { transform: scale(1.06); } 56% { transform: scale(1); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes slide { from { transform: translateX(-640px); } to { transform: translateX(1280px); } }
      @media (prefers-reduced-motion: reduce) { .beat, .orb1, .orb2, .line { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <circle class="orb1" cx="1180" cy="40" r="150" fill="#F1BF0A" opacity="0.10"/>
    <circle class="orb2" cx="120" cy="330" r="190" fill="#ffffff" opacity="0.06"/>
    <circle class="orb1" cx="700" cy="350" r="110" fill="#F1BF0A" opacity="0.08"/>
    <rect class="line" x="0" y="318" width="640" height="6" fill="url(#sweep)"/>
  </g>
  <text class="title" x="72" y="170">HeartCode</text>
  <text class="tag" x="76" y="224">Build a personal website for someone special.</text>
  <rect x="76" y="256" rx="20" ry="20" width="248" height="40" fill="#F1BF0A"/>
  <text class="chip" x="100" y="282">Pick. Fill in. Go live.</text>
  <g class="beat">
    <circle cx="1090" cy="170" r="92" fill="#ffffff" opacity="0.10"/>
    <circle cx="1090" cy="170" r="68" fill="#F1BF0A"/>
    <path d="M1090 202 C1052 176 1050 146 1070 138 C1081 134 1088 140 1090 148 C1092 140 1099 134 1110 138 C1130 146 1128 176 1090 202 Z" fill="#183fad"/>
  </g>
</svg>
