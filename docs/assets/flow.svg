<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="How HeartCode works: pick a type, fill in a short form, preview the polished copy, pay and go live">
  <title>How HeartCode works</title>
  <defs>
    <style>
      .card  { fill: #ffffff; stroke: #e4e7ec; stroke-width: 2; }
      .num   { font: 800 20px 'Poppins','Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #14151d; }
      .h     { font: 700 21px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #14151d; }
      .p     { font: 400 15.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill: #475467; }
      .wire  { stroke: #183fad; stroke-width: 3; stroke-dasharray: 8 9; fill: none; animation: dash 1.1s linear infinite; }
      .pop   { transform-box: fill-box; transform-origin: center; animation: pop 4.8s ease-in-out infinite; }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: 1.2s; } .d3 { animation-delay: 2.4s; } .d4 { animation-delay: 3.6s; }
      @keyframes dash { to { stroke-dashoffset: -34; } }
      @keyframes pop  { 0%,20%,100% { transform: scale(1); } 8% { transform: scale(1.14); } }
      @media (prefers-reduced-motion: reduce) { .wire, .pop { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="260" fill="#ffffff"/>
  <path class="wire" d="M292 130 H338"/>
  <path class="wire" d="M622 130 H668"/>
  <path class="wire" d="M952 130 H998"/>

  <rect class="card" x="20" y="30" width="272" height="200" rx="26"/>
  <circle class="pop d1" cx="62" cy="76" r="22" fill="#F1BF0A"/>
  <text class="num" x="62" y="83" text-anchor="middle">1</text>
  <text class="h" x="40" y="132">Pick a type</text>
  <text class="p" x="40" y="162">Birthday, anniversary and more,</text>
  <text class="p" x="40" y="184">each with its own form.</text>

  <rect class="card" x="338" y="30" width="284" height="200" rx="26"/>
  <circle class="pop d2" cx="380" cy="76" r="22" fill="#F1BF0A"/>
  <text class="num" x="380" y="83" text-anchor="middle">2</text>
  <text class="h" x="358" y="132">Fill in a short form</text>
  <text class="p" x="358" y="162">Names, dates, photos and a few</text>
  <text class="p" x="358" y="184">words from the heart.</text>

  <rect class="card" x="668" y="30" width="284" height="200" rx="26"/>
  <circle class="pop d3" cx="710" cy="76" r="22" fill="#F1BF0A"/>
  <text class="num" x="710" y="83" text-anchor="middle">3</text>
  <text class="h" x="688" y="132">Preview polished copy</text>
  <text class="p" x="688" y="162">Wording can be polished by AI and</text>
  <text class="p" x="688" y="184">shown live before paying.</text>

  <rect class="card" x="998" y="30" width="262" height="200" rx="26"/>
  <circle class="pop d4" cx="1040" cy="76" r="22" fill="#183fad"/>
  <text class="num" x="1040" y="83" text-anchor="middle" style="fill:#ffffff">4</text>
  <text class="h" x="1018" y="132">Pay and go live</text>
  <text class="p" x="1018" y="162">A real hosted site, and a</text>
  <text class="p" x="1018" y="184">confirmation email.</text>
</svg>
